# Builds the interactive PreTeXt web edition from the LaTeX sources and,
# on pushes to master, deploys it to https://fax.minegahara.net as a
# Cloudflare Worker (configuration in pretext/wrangler.jsonc).
#
# Security notes (this repository is public):
# - The Cloudflare token lives only in the "cloudflare" GitHub environment,
#   which should be restricted to the master branch (Settings -> Environments).
#   Workflows started by pull requests never receive it: GitHub withholds
#   secrets from fork pull requests, and the deploy job does not run for them.
# - Building (LaTeX, PreTeXt, pip packages) happens in a job with no secrets.
#   The deploy job only downloads the built files and runs a pinned wrangler.
# - Third-party actions are pinned to commit SHAs.
# - Do not change the trigger to pull_request_target.

name: PreTeXt web edition

on:
  push:
    branches: [ master ]
    paths: [ 'Latex-Files/**', 'pretext/**', '.github/workflows/pretext.yml' ]
  pull_request:
    branches: [ master ]
    paths: [ 'Latex-Files/**', 'pretext/**', '.github/workflows/pretext.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pretext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: the trees and proofs were verified with Ubuntu 24.04's TeX Live
    # 2023. ubuntu-latest (26.04, TeX Live 2025) fails on one proof.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PreTeXt
        run: pip install -r pretext/requirements.txt

      - name: Install LaTeX (for proof trees and natural deduction proofs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended

      # Reuse previously typeset trees and proofs; only changed ones are
      # re-run through LaTeX.  The key includes the LaTeX support files, so
      # editing them re-typesets everything.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: pretext/.cache
          key: pretext-images-${{ hashFiles('pretext/latex/**') }}-${{ github.sha }}
          restore-keys: pretext-images-${{ hashFiles('pretext/latex/**') }}-

      - name: Convert and build
        run: ./pretext/build.sh images

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: pretext/output/web
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare
      url: https://fax.minegahara.net
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: pretext/wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: pretext/output/web

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.160.1'
          workingDirectory: pretext
          command: deploy
